[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mira-memory"
version = "0.2.0"
description = "MIRA — attributed, ablatable, versioned long-term memory for AI agents (local-first; see docs/FRAMEWORK.md)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aryan Chavan" }]
keywords = [
  "ai memory", "rag", "agents", "retrieval", "auditability",
  "versioned memory", "local-first", "llm",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<2.0",
  "faiss-cpu>=1.8.0 ; python_version < '3.13'",
  "networkx>=3.2",
  "pyyaml>=6.0",
  "psutil>=5.9",
  "sentence-transformers>=3.0",
  "pypdf>=4.2",
  "tqdm>=4.66",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.2.90 ; python_version < '3.13'"]
ingest = ["python-docx>=1.1"]
server = ["python-multipart>=0.0.9", "streamlit>=1.36", "plotly>=5.22", "pandas>=2.2"]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = [
  "mira_sdk", "core", "config", "storage", "models", "evaluation",
]

[tool.setuptools.package-data]
config = ["*.yaml"]
